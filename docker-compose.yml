# docker-compose.yml (최종 수정본)
services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - nest-api
      - vue-admin
      - vue-main
      - vue-store

  certbot:
    image: certbot/certbot
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    # ✅ $$! 로 수정 완료!
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $$!; done'"

  nest-api:
    build: ./nest-api
    env_file:
      - ./nest-api/.env.prod

  vue-admin:
    build:
      context: ./vue-admin
      target: production

  vue-main:
    build:
      context: ./vue-main
      target: production

  vue-store:
    build:
      context: ./vue-store
      target: production
