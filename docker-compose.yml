# docker-compose.yml (운영 환경 배포용 - SSL 자동 갱신 포함)
services:
  # Nginx (모든 트래픽의 입구)
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - /etc/letsencrypt:/etc/letsencrypt:ro
      # ✅ Certbot과 인증 파일을 공유할 폴더 추가
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - nest-api
      - vue-admin
      - vue-main
      - vue-store

  # ✅ 인증서 자동 갱신을 담당하는 서비스 추가
  certbot:
    image: certbot/certbot
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    # 12시간마다 갱신 확인을 시도하는 명령어
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $!; done'"

  nest-api:
    build: ./nest-api
    env_file:
      - ./nest-api/.env.prod

  vue-admin:
    build:
      context: ./vue-admin
      target: production

  vue-main:
    build:
      context: ./vue-main
      target: production

  vue-store:
    build:
      context: ./vue-store
      target: production
