# 예시: codept.kr (다른 서브도메인 블록의 80번 포트 설정에도 모두 동일하게 추가)
server {
    listen 80;
    server_name codept.kr www.codept.kr;

    # ✅ SSL 갱신을 위한 인증용 비밀 통로
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 기존 HTTPS 리다이렉트 설정
    location / {
        return 301 https://$host$request_uri;
    }
}

# --- 아래의 listen 443 설정들은 기존과 동일하게 유지 ---
server {
    listen 443 ssl;
    server_name codept.kr www.codept.kr;
    
    ssl_certificate /etc/letsencrypt/live/codept.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/codept.kr/privkey.pem;

    location / {
        proxy_pass http://vue-main:80;
    }
}